name: Bot CI

on:
  pull_request:
    paths:
      - "bot/**"
      - "scripts/up.sh"
      - "scripts/test-up-guards.sh"
      - "docker-compose.yml"
      - ".github/workflows/bot-ci.yml"
  push:
    branches:
      - main
    paths:
      - "bot/**"
      - "scripts/up.sh"
      - "scripts/test-up-guards.sh"
      - "docker-compose.yml"
      - ".github/workflows/bot-ci.yml"

permissions:
  contents: read

jobs:
  dependency-and-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check bot syntax
        run: node --check index.js

      - name: Run dependency smoke test
        run: npm test

      - name: Reject known production vulnerabilities
        run: npm audit --omit=dev

      - name: Test startup safety guards
        working-directory: .
        run: ./scripts/test-up-guards.sh
